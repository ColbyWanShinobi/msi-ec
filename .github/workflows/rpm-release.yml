name: RPM Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rpm:
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install build tooling
        run: dnf install -y rpm-build akmods kernel-devel kmodtool gcc make elfutils-libelf-devel tar gzip
      - name: Check tag version
        if: github.event_name == 'push'
        run: |
          VERSION="$(sed -n 's/^VERSION[[:space:]]*:=\|^VERSION[[:space:]]*?=//p' Makefile.vars | tr -d '[:space:]')"
          test "${GITHUB_REF_NAME#v}" = "$VERSION"
      - name: Build RPM
        run: ./packaging/rpm-akmod/build-rpm.sh
      - uses: actions/upload-artifact@v4
        with:
          name: msi-ec-akmod-rpm
          path: dist/rpmbuild/RPMS/**/*.rpm
      - name: Publish GitHub release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/rpmbuild/RPMS/**/*.rpm
