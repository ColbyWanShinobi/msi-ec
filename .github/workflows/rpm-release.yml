name: RPM Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rpm:
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install build tooling
        run: dnf install -y rpm-build akmods kernel-devel kmodtool gcc make elfutils-libelf-devel tar gzip golang
      - name: Install Debian package tooling
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
      - name: Read package version
        id: version
        run: |
          VERSION="$(sed -n 's/^VERSION[[:space:]]*:=\|^VERSION[[:space:]]*?=//p' Makefile.vars | tr -d '[:space:]')"
          test -n "$VERSION"
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Check tag version
        if: github.event_name == 'push'
        run: |
          test "${GITHUB_REF_NAME#v}" = "${{ steps.version.outputs.value }}"
      - name: Build RPM
        run: ./packaging/rpm-akmod/build-rpm.sh
      - name: Build Debian package
        run: PATH="$HOME/go/bin:$PATH" make -C packaging/nfpm-alpine-debian-slackware package-all
      - uses: actions/upload-artifact@v4
        with:
          name: msi-ec-akmod-rpm
          path: |
            dist/rpmbuild/RPMS/**/*.rpm
            packaging/nfpm-alpine-debian-slackware/*.deb
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', steps.version.outputs.value) || github.ref_name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            dist/rpmbuild/RPMS/**/*.rpm
            packaging/nfpm-alpine-debian-slackware/*.deb
